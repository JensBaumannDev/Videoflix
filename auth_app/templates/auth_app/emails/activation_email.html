<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm your email</title>
</head>
<body style="margin:0; padding:0; background-color:#ffffff;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" style="padding:24px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
               style="max-width:600px; font-family:Arial, Helvetica, sans-serif; font-size:16px; line-height:1.5; color:#3c4043;">
          <tr>
            <td align="center" style="padding-bottom:32px;">
              <img src="cid:{{ logo_cid }}" alt="Videoflix" width="240"
                   style="display:block; width:240px; max-width:100%; height:auto; border:0;">
            </td>
          </tr>
          <tr>
            <td>
              <p style="margin:0;">Dear Videoflix user,</p>
              <p style="margin:0 0 24px;">Thank you for registering with <span style="color:#2E3EDF;">Videoflix</span>.
                To complete your registration and verify your email address, please click the link below:</p>
            </td>
          </tr>
          <tr>
            <td style="padding-bottom:24px;">
              <a href="{{ activation_link }}"
                 style="display:inline-block; padding:12px 24px; background-color:#2E3EDF; color:#ffffff; font-weight:bold; text-decoration:none; border-radius:40px;">Activate account</a>
            </td>
          </tr>
          <tr>
            <td>
              <p style="margin:0 0 24px;">If you did not create an account with us, please disregard this email.</p>
              <p style="margin:0 0 24px;">Best regards,</p>
              <p style="margin:0;">Your Videoflix Team.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
